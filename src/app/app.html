<main>
  <header class="brand">Moodnote</header>
  <p class="eyebrow">MUSIC FOR YOUR MOOD</p>
  <h1>Choose how you feel</h1>
  <p>Pick a mood to get a song suggestion.</p>

  <section aria-label="Choose a mood">
    <div class="moods">
      @for (mood of moods; track mood.name) {
        <button type="button" [class.selected]="selectedMood.name === mood.name" [attr.aria-pressed]="selectedMood.name === mood.name" (click)="chooseMood(mood)">{{ mood.name }}</button>
      }
    </div>
  </section>

  <section class="track-card" aria-live="polite">
    <p class="eyebrow">{{ selectedMood.name }} song</p>
    <h2>{{ currentTrack.title }}</h2>
    <p>{{ currentTrack.artist }}</p>
    <p>{{ selectedMood.description }}</p>
    <button type="button" class="next-button" (click)="nextTrack()">Suggest another</button>
  </section>
</main>

<router-outlet />
